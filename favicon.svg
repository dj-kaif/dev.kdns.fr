<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Purple to Blue to Emerald Gradient -->
    <linearGradient id="nexusGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
  </defs>

  <!-- Squircle Dark Container Background -->
  <rect width="512" height="512" rx="115" fill="#070a12" />

  <!-- Centered Scaled Logo Geometry -->
  <g transform="translate(256 256) scale(2.35) translate(-100 -100)">
    <path d="M 60 70 A 30 30 0 0 1 120 70 C 120 95 80 105 80 130 A 30 30 0 0 0 140 130" 
          fill="none" 
          stroke="url(#nexusGrad)" 
          stroke-width="24" 
          stroke-linecap="round" />
    <path d="M 140 70 A 30 30 0 0 0 80 70 C 80 95 120 105 120 130 A 30 30 0 0 1 60 130" 
          fill="none" 
          stroke="url(#nexusGrad)" 
          stroke-width="24" 
          stroke-linecap="round" 
          opacity="0.8" />
  </g>
</svg>
